[project]
name = "pt-p300bt"
version = "0.0.0"
description = "Label printing tools for the Brother PT-P300BT"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
  "fonttools",
  "packbits",
  "pdf2image",
  "pillow",
  "pyobjc-framework-iobluetooth; sys_platform == 'darwin'",
  "pyserial",
  "uharfbuzz",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "ty"]
build = ["pyinstaller"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "native"]
addopts = "--strict-markers --strict-config -ra"

[tool.ruff]
line-length = 100
target-version = "py315"
extend-exclude = ["old"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "PTH", "RUF", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.ty.src]
exclude = ["old"]
