name: Build Workflow for printlabel.exe/zip

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5

      - name: Run PyInstaller to create printlabel.exe
        run: >
          mise exec -- uv run --locked --group build pyinstaller printlabel.spec -- --default
          --version ${{ github.ref_name }}

      - name: Zip the printlabel.exe asset to printlabel.zip
        run: |
          Compress-Archive dist/printlabel.exe dist/printlabel.zip
        shell: pwsh

      - name: Generate Changelog
        run: >
          echo "The *printlabel.exe* executable file in the
          *printlabel.zip* archive within the assets below is
          auto-generated by a [GitHub Action](.github/workflows/build.yml)."
          > ${{ github.workspace }}-CHANGELOG.txt

      - name: Create Release, uploading the printlabel.zip asset
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: ${{ github.workspace }}-CHANGELOG.txt
          files: dist/printlabel.zip
          append_body: true
          generate_release_notes: true

      - name: Remove old releases
        uses: Nats-ji/delete-old-releases@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep-count: 1
          keep-old-minor-releases: false
          keep-old-minor-releases-count: 1
          remove-tags: true
